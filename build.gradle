plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

def target = new groovy.json.JsonSlurper().parse(file('target.json'))
version = target.mod_version
group = 'dev.tqnl'
base { archivesName = 'redstone-numbers' }

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.terraformersmc.com/'
        content { includeGroup 'com.terraformersmc' }
    }
    maven {
        url = 'https://maven.caffeinemc.net/releases'
        content { includeGroup 'net.caffeinemc' }
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        redstonenumbers {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${target.minecraft}"
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation "net.fabricmc.fabric-api:fabric-api:${target.fabric_api}"
    compileOnly "com.terraformersmc:modmenu:${target.modmenu}"
    compileOnly "net.caffeinemc:sodium-fabric-api:${target.sodium_api}"
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.toVersion(target.java)
    targetCompatibility = JavaVersion.toVersion(target.java)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = target.java }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
processResources {
    inputs.properties target
    filesMatching('fabric.mod.json') { expand target + [version: project.version] }
    from('cosmetic/textures') {
        include 'redstone_dust_dot.png', 'redstone_dust_line0.png', 'redstone_dust_line1.png'
        into 'resourcepacks/clean_lines/assets/minecraft/textures/block'
    }
    from('src/main/resources/assets/redstonenumbers/icon.png') {
        into 'resourcepacks/clean_lines'
        rename 'icon.png', 'pack.png'
    }
    from(['credits.txt', 'ASSET-LICENSES.md']) { into 'resourcepacks/clean_lines' }
}
jar { from('LICENSE') { rename { 'LICENSE-redstone-numbers' } } }
test { useJUnitPlatform() }
