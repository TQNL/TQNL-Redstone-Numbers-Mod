plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
    id 'maven-publish'
}

version = '0.1.2+mc1.21.11'
group = 'dev.tqnl'
base { archivesName = 'redstone-numbers' }

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.terraformersmc.com/'
        content { includeGroup 'com.terraformersmc' }
    }
    maven {
        url = 'https://maven.caffeinemc.net/releases'
        content { includeGroup 'net.caffeinemc' }
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        redstonenumbers {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    modCompileOnly 'com.terraformersmc:modmenu:17.0.1'
    modCompileOnly 'net.caffeinemc:sodium-fabric-api:0.8.12+mc1.21.11'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
    from('cosmetic/textures') {
        include 'redstone_dust_dot.png', 'redstone_dust_line0.png', 'redstone_dust_line1.png'
        into 'resourcepacks/clean_lines/assets/minecraft/textures/block'
    }
    from('src/main/resources/assets/redstonenumbers/icon.png') {
        into 'resourcepacks/clean_lines'
        rename 'icon.png', 'pack.png'
    }
    from(['credits.txt', 'ASSET-LICENSES.md']) { into 'resourcepacks/clean_lines' }
}
jar { from('LICENSE') { rename { 'LICENSE-redstone-numbers' } } }
test { useJUnitPlatform() }
